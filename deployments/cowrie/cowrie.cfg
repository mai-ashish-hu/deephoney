[honeypot]
hostname = svr04
sensor_name = deephoney-cowrie
log_path = /opt/cowrie-src/var/log/cowrie
state_path = /opt/cowrie-src/var/lib/cowrie
download_path = /opt/cowrie-src/var/lib/cowrie/downloads
share_path = share/cowrie
contents_path = honeyfs
txtcmds_path = txtcmds
timezone = UTC
download_limit_size = 10485760
ttylog = false
interactive_timeout = 180
authentication_timeout = 120
auth_class = UserDB

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = /opt/cowrie-src/var/log/cowrie/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = false
